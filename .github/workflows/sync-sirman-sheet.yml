name: Sync Sirman price/stock to Google Sheet

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 Thailand time, daily
  workflow_dispatch:
    inputs:
      full_crawl:
        description: "Crawl every Sirman product (slow), not just the known ones"
        type: boolean
        default: false
      dry_run:
        description: "Do not write to the sheet"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/sheet_sync/requirements.txt
      - run: pip install -r scripts/sheet_sync/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Sync
        run: python scripts/sheet_sync/sync_sirman_to_sheet.py
        env:
          SIRMAN_USER: ${{ secrets.SIRMAN_USER }}
          SIRMAN_PASSWORD: ${{ secrets.SIRMAN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
          EUR_THB: ${{ vars.EUR_THB || '38' }}
          FULL_CRAWL: ${{ inputs.full_crawl && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
