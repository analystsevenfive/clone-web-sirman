name: Diagnose secrets (runner secret-masker crash)

# Each job references exactly one secret. The job that crashes with
# "ArgumentOutOfRangeException ... SecretMasker.AddValue" is the culprit.
# Only the value's length is printed, never the value.

on:
  workflow_dispatch:

jobs:
  sirman_user:
    runs-on: [self-hosted, windows]
    steps:
      - run: Write-Host "length = $($env:V.Length)"
        env:
          V: ${{ secrets.SIRMAN_USER }}
  sirman_password:
    runs-on: [self-hosted, windows]
    steps:
      - run: Write-Host "length = $($env:V.Length)"
        env:
          V: ${{ secrets.SIRMAN_PASSWORD }}
  google_sheet_id:
    runs-on: [self-hosted, windows]
    steps:
      - run: Write-Host "length = $($env:V.Length)"
        env:
          V: ${{ secrets.GOOGLE_SHEET_ID }}
  google_service_account_b64:
    runs-on: [self-hosted, windows]
    steps:
      - run: Write-Host "length = $($env:V.Length)"
        env:
          V: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
